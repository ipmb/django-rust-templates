[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "django-rust-templates"
description = "Django's template engine, reimplemented in Rust as a drop-in replacement"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "python"
module-name = "django_rust_templates._native"
manifest-path = "crates/template-py/Cargo.toml"
