name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  wheels:
    name: Wheels / ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.7,<2' twine
      - run: maturin sdist --out dist
      - run: python -m twine check dist/*
      - name: Install from sdist and render
        run: |
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-test/bin/python -I scripts/ci/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub preliminary release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install packaging
      - name: Check tag against distribution version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import email
          import os
          import pathlib
          import tarfile
          import zipfile
          from packaging.version import Version

          expected = Version(os.environ['RELEASE_TAG'][1:])
          artifacts = list(pathlib.Path('dist').iterdir())
          assert artifacts, 'No release artifacts'
          for path in artifacts:
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as wheel:
                      metadata = wheel.read(next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA')))
              else:
                  with tarfile.open(path) as source:
                      metadata = source.extractfile(next(m for m in source.getmembers() if m.name.endswith('/PKG-INFO'))).read()
              actual = Version(email.message_from_bytes(metadata)['Version'])
              assert actual == expected, f'{path}: {actual} != {expected}'
          PY
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --generate-notes
