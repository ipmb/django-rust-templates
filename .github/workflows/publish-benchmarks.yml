name: Publish benchmark report

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Generate report
    uses: ./.github/workflows/benchmarks.yml
    with:
      pages: true

  pages:
    name: Deploy report
    needs: benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy benchmark report
        id: deployment
        uses: actions/deploy-pages@v4
